server:
  port: 8081
spring:
  application:
    name: user-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${hm.db.host}:3307/campus-user?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
  redis:
    host: ${hm.redis.host}
    port: 6379
    password: ${hm.redis.pw}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
  cloud:
    nacos:
      server-addr: 192.168.100.128:8848
      discovery:
        timeout: 5000
        connect-timeout: 5000
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
logging:
  level:
    com.campus: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
knife4j:
  enable: true
  openapi:
    title: 轻享校园-用户服务接口文档
    description: "用户服务：登录注册、用户信息、Redis会话缓存、限流防刷、积分"
    email: campus@campus.com
    concat: campus
    url: https://www.campus.com
    version: v1.0.0
    group:
      default:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.campus.user.controller
# JWT 配置（与网关共享同一密钥；生产环境务必通过环境变量 JWT_SECRET 注入，不要用默认值）
hm:
  jwt:
    secret: ${JWT_SECRET:campus-dev-secret-change-me}
    tokenTTL: 30m
feign:
  okhttp:
    enabled: true
