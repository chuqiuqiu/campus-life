# 轻享校园生活服务平台 Nginx 配置
# 部署位置：虚拟机 192.168.100.128（Docker 或本机 nginx）
# 说明：前端打包产物放到 html/campus-life-web/dist 目录
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;

    sendfile        on;
    keepalive_timeout  65;

    # 前端门户：监听 8088（与黑马商城门户端口一致）
    server {
        listen       8088;
        server_name  localhost;

        # 前端静态资源（vue-cli 打包产物）
        location / {
            root   html/campus-life-web/dist;
            index  index.html;
            # vue-router history 模式回退
            try_files $uri $uri/ /index.html;
        }

        # 反向代理：/api 前缀转发到网关服务（去掉 /api 前缀）
        location /api {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite /api/(.*)  /$1 break;
            proxy_pass http://192.168.100.128:8080;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
